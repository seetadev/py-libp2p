[project]
name = "p2p-federated-learning"
version = "0.1.0"
description = "Minimal decentralized federated-learning prototype over py-libp2p"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "libp2p",
    "trio",
    "scikit-learn",
    "numpy",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-trio"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
trio_mode = true
testpaths = ["tests"]
